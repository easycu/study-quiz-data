<!-- 파일을 고칠 때마다 아래 ?v= 숫자를 바꾸면, 브라우저가 예전 파일을 쓰지 않고 새로 받는다 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1e1e2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<script>
// 파일이 빠졌거나 예전 파일이 섞여서 게임이 멈추면, 검은 화면 대신 원인을 화면에 보여준다
(function () {
  var shown = {};
  function report(text) {
    if (shown[text]) return; shown[text] = 1;
    var box = document.getElementById("loadError");
    if (!box) {
      box = document.createElement("div"); box.id = "loadError";
      box.style.cssText = "position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#5a1e28;color:#fff;" +
        "border:2px solid #ff8080;border-radius:10px;padding:10px 14px;font:14px/1.5 sans-serif;white-space:pre-wrap";
      box.textContent = "게임 파일에 문제가 있습니다. js 폴더 안에 파일이 모두 올라갔는지, 예전 파일이 섞이지 않았는지 확인하세요.\n";
      document.body.appendChild(box);
    }
    box.textContent += "\n• " + text;
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t !== window && (t.tagName === "SCRIPT" || t.tagName === "LINK")) report("파일을 찾을 수 없음: " + (t.src || t.href));
    else if (e.message) report(e.message + (e.filename ? "  (" + e.filename.split("/").slice(-2).join("/") + ")" : ""));
  }, true);
})();
</script>
<canvas id="game"></canvas>
<button id="pauseBtn" class="hidden" aria-label="일시정지">II</button>

<!-- 시작: 무기 고르기 -->
<div id="svMenu" class="overlay">
  <div class="panel wide">
    <h1>⚔ 서바이벌 모드</h1>
    <p class="hint">10분 버티기 · 무기는 자동 공격 · 레벨업마다 O/X 문제 1개<br>맞히면 강화 3개(연속 정답 3번부터 4개), 틀리면 2개 중에서 골라요</p>
    <h2>시작 무기</h2>
    <div class="row wpns">
      <button class="wpn big" data-w="gun">🔫 마법 탄환<small>가까운 적 자동 조준</small></button>
      <button class="wpn big" data-w="whip">🗡 회전 베기<small>넓게 베고 크게 밀침</small></button>
      <button class="wpn big" data-w="orbit">🌀 회전 칼날<small>몸 주변을 지킴</small></button>
    </div>
    <p id="svStatus" class="status"></p>
    <div class="row opts">
      <button class="opt" data-opt="quality"></button>
      <button class="opt" data-opt="sfx"></button>
      <button class="opt" data-opt="music"></button>
      <button class="opt" data-opt="shake"></button>
    </div>
    <h2>🏆 서바이벌 기록</h2>
    <div class="scroll"><table id="svRecords"></table></div>
    <div class="row"><a class="btnlink" href="index.html">← 던전 모드로</a></div>
  </div>
</div>

<!-- 일시정지 -->
<div id="pause" class="overlay hidden">
  <div class="panel">
    <h2>일시정지</h2>
    <button id="btnResume" class="big">계속하기</button>
    <div class="row opts">
      <button class="opt" data-opt="sfx"></button>
      <button class="opt" data-opt="music"></button>
      <button class="opt" data-opt="quality"></button>
      <button class="opt" data-opt="shake"></button>
    </div>
    <button id="btnQuit">그만하기 (기록 안 함)</button>
  </div>
</div>

<!-- 결과 -->
<div id="svResult" class="overlay hidden">
  <div class="panel wide">
    <h2 id="svResTitle"></h2>
    <div id="svResStats" class="svstats"></div>
    <h2>무기별 피해</h2>
    <div id="svResDmg"></div>
    <div class="row"><button id="btnAgain" class="big">다시 하기</button></div>
  </div>
</div>

<div id="zoomView" class="hidden">
  <div id="zoomStage"><img id="zoomImg" alt="확대 이미지" draggable="false"></div>
  <button id="zoomClose" aria-label="닫기">✕</button>
  <p id="zoomHint">두 손가락으로 벌려 더 확대 · 두 번 톡 = 확대/원래대로 · ✕ 또는 Esc로 닫기</p>
</div>
<div id="rotateHint" class="hidden">휴대폰을 <b>가로</b>로 돌리면 더 크게 보여요</div>
